<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA1 – 3D Shapes in WebGL – 241487</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
